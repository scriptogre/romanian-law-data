[project]
name = "romanian-law-data"
version = "0.1.0"
description = "ETL pipeline producing parquet bundles of Romanian legal acts."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=17",
    "loguru>=0.7",
    "requests>=2.32",
    "duckdb>=1.5.3",
    "pyyaml>=6.0",
    "pandera[polars]>=0.31.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
