name: sync-relationships

# Builds/refreshes the durable relationships cache (a release asset) via
# `etl/extracts/relationships.py`. legislatie.just.ro throttles per IP (a few
# hundred acts fast, then ~1 req/s), so one runner can't do it. The work is
# SHARDED across N runners (= N IPs): each fetches ids[shard::N] into a shard
# parquet; the publish job folds shards into the cache and uploads it. Resumable:
# each round fetches only still-uncached acts, so re-dispatch until REMAINING=0.
#
# Backfill: dispatch mode=backfill. Nightly: delta (new + reconcile).
# TODO downstream (needs parsers + cache wired into transform):
#   affected_by_html -> status / in_force_until; affects_html -> relationship edges.

on:
  schedule:
    - cron: "0 1 * * *"        # nightly delta, before the 03:00 corpus sync
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill (all uncached) or delta (new + reconcile)."
        default: "delta"
        type: choice
        options: ["delta", "backfill"]
      shards:
        description: "Parallel runners (= IPs)."
        default: "16"
      limit:
        description: "Cap ids per shard (smoke runs). Empty = full."
        default: ""
      release_tag:
        description: "Publish cache to this tag instead of `relationships`."
        default: ""

permissions:
  contents: write

env:
  SHARDS: ${{ inputs.shards || '16' }}
  ETL_RELATIONSHIPS_MODE: ${{ inputs.mode || 'delta' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  extract:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ETL_RELATIONSHIPS_SHARD: ${{ matrix.shard }}
      ETL_RELATIONSHIPS_SHARDS: ${{ inputs.shards || '16' }}
      ETL_RELATIONSHIPS_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Download corpus + current cache
        run: |
          mkdir -p data
          LATEST=$(gh release list --json tagName --jq '[.[] | select(.tagName | startswith("laws/"))][0].tagName')
          gh release download "$LATEST" --pattern 'documents.parquet' --dir data
          gh release download relationships --pattern 'raw_relationships.parquet' --dir data || echo "no cache yet"
      - name: Extract shard
        run: uv run python -m etl.extract relationships
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relationships-shard-${{ matrix.shard }}
          path: data/relationships_shard_*.parquet
          if-no-files-found: ignore

  publish:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    env:
      ETL_RELATIONSHIPS_RELEASE_TAG: ${{ inputs.release_tag || 'relationships' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Download corpus + current cache
        run: |
          mkdir -p data
          LATEST=$(gh release list --json tagName --jq '[.[] | select(.tagName | startswith("laws/"))][0].tagName')
          gh release download "$LATEST" --pattern 'documents.parquet' --dir data
          gh release download relationships --pattern 'raw_relationships.parquet' --dir data || echo "first round, no cache"
      - uses: actions/download-artifact@v6
        with:
          pattern: relationships-shard-*
          path: data
          merge-multiple: true
      - name: Merge shards -> cache + publish
        run: uv run python -m etl.extract relationships-merge
