name: sync-web

# DRAFT. Builds/refreshes the durable actiuni HTML cache (a release asset) on a
# single runner via `python -m etl.extract actiuni` (etl/extracts/web.py).
# Backfill once (mode=backfill), then a cheap nightly delta. Resumable: web.run
# fetches only acts NOT already in the cache, so a timed-out run just re-runs.
# Parsing the HTML into status/relationships + republishing the corpus is a
# separate downstream step (parsers do not exist yet) - see TODO.
#
# BAKED CHOICES TO CONFIRM:
#  - cache persisted as a single rolling release tag `actiuni-cache`
#  - corpus (act ids) sourced from the latest `laws/*` release `acte.parquet`
#  - delta = new acts + a 1/30 reconcile slice (no induse-propagation yet)

on:
  schedule:
    - cron: "0 1 * * *"        # nightly delta, before the 03:00 corpus sync
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill (all uncached acts) or delta (new + reconcile)."
        default: "delta"
        type: choice
        options: ["delta", "backfill"]
      limit:
        description: "Cap ids fetched (smoke test). Empty = no cap."
        default: ""

permissions:
  contents: write

env:
  CACHE_TAG: actiuni-cache

jobs:
  extract_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ETL_ACTIUNI_MODE: ${{ inputs.mode || 'delta' }}
      ETL_ACTIUNI_LIMIT: ${{ inputs.limit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: Download latest corpus + current cache (cache may not exist yet)
        run: |
          mkdir -p data
          LATEST=$(gh release list --json tagName --jq '[.[] | select(.tagName | startswith("laws/"))][0].tagName')
          gh release download "$LATEST" --pattern 'acte.parquet' --dir data
          gh release download "$CACHE_TAG" --pattern 'actiuni_cache.parquet' --dir data || echo "no cache yet (first backfill)"

      - name: Fetch actiuni -> cache
        run: uv run python -m etl.extract actiuni

      - name: Publish cache release
        run: |
          gh release delete "$CACHE_TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$CACHE_TAG" 2>/dev/null || true
          gh release create "$CACHE_TAG" data/actiuni_cache.parquet \
            --title "actiuni HTML cache" \
            --notes "Rolling per-act actiuni HTML cache. Rebuilt by sync-web."

# TODO (downstream, needs parsers + the cache wired into transform):
#  parse suferite_html -> status / in_force_until,
#  parse induse_html  -> relationships (+ propagate status to targets),
#  join the cache in transforms/status.py, republish the corpus release.
