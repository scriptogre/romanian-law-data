name: probe-actiuni

# Finds the actiuni concurrency sweet spot (max goodput before 503s dominate).
# One runner sweeps concurrency levels back-to-back; compare goodput_ok_s in the
# run summary. The failures are 503 (server choke), not 403/429 - so this is
# about pacing one IP, not parallelising across IPs.

on:
  workflow_dispatch:
    inputs:
      sweep:
        description: "Concurrency levels to sweep, comma-separated."
        default: "2,5,10,20,40"
      requests:
        description: "Requests per level."
        default: "300"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Probe
        run: |
          uv run python -m etl.probe_actiuni \
            --sweep "${{ inputs.sweep }}" \
            --requests ${{ inputs.requests }} \
            | tee probe.out
          grep PROBE_RESULT probe.out >> "$GITHUB_STEP_SUMMARY"
