name: sync-documents

# Builds the legal corpus release. The fetch sweeps the document-id space and
# reads each act's /Public/DetaliiDocument/{id} page (the SOAP Search API has no
# stable sort, so paginating it drops ~1/3 of acts; see extracts/documents.py).
# SHARDED across N runners (= N IPs) by id stride; the site throttles per IP, so
# N runners ~= Nx throughput. Each shard writes parquet parts into
# data/raw_documents/; the publish job gathers them, transforms, validates, and
# publishes. publish only runs if ALL shards succeed (a partial corpus must not publish).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel runners (= IPs)."
        default: "16"
      limit:
        description: "Cap ids per shard (smoke runs). Empty = full."
        default: ""
      max_id:
        description: "Pin the top of the id sweep. Empty = auto-discover the newest id (default)."
        default: ""
      release_tag:
        description: "Publish to this tag instead of laws/<date> (e.g. smoke/2026-06-03)."
        default: ""

permissions:
  contents: write

env:
  SHARDS: ${{ inputs.shards || '16' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      max_id: ${{ steps.max_id.outputs.max_id }}
    steps:
      - id: gen
        run: echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Discover newest document id (one probe, shared by every shard)
        id: max_id
        run: |
          # Honour a pinned max_id input; otherwise probe the portal for the newest act id.
          if [ -n "${{ inputs.max_id }}" ]; then
            MAX_ID="${{ inputs.max_id }}"
            echo "max_id pinned by input: $MAX_ID"
          else
            MAX_ID=$(uv run python -m etl.extract documents-max-id | tail -n1)
            echo "max_id discovered: $MAX_ID"
          fi
          echo "max_id=$MAX_ID" >> "$GITHUB_OUTPUT"

  extract:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ETL_DOCUMENTS_SHARD: ${{ matrix.shard }}
      ETL_DOCUMENTS_SHARDS: ${{ inputs.shards || '16' }}
      ETL_DOCUMENTS_LIMIT: ${{ inputs.limit }}
      ETL_DOCUMENTS_MAX_ID: ${{ needs.prepare.outputs.max_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Extract shard
        run: uv run python -m etl.extract documents
      - uses: actions/upload-artifact@v7
        with:
          name: raw-documents-${{ matrix.shard }}
          path: data/raw_documents/*.parquet
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: raw-versions-${{ matrix.shard }}
          path: data/raw_versions/*.parquet
          if-no-files-found: ignore

  publish:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: Gather raw_documents parts from all shards
        uses: actions/download-artifact@v6
        with:
          pattern: raw-documents-*
          path: data/raw_documents
          merge-multiple: true

      - name: Gather raw_versions parts from all shards
        uses: actions/download-artifact@v6
        with:
          pattern: raw-versions-*
          path: data/raw_versions
          merge-multiple: true

      - name: Download relationships cache (for the status column)
        run: gh release download relationships --pattern 'raw_relationships.parquet' --dir data || echo "no relationships cache yet (status will be NULL)"

      - name: Transform → Load (parquet + Pandera validation + FTS)
        run: uv run python -m etl.transform

      - name: Run tests (unit + corpus invariants)
        run: uv run pytest -q

      - name: Prepare release files + manifest
        id: prep
        run: |
          cp create_views.sql data/create_views.sql
          # Concat raw shards into single assets (raw_versions may be empty -> empty file).
          uv run python - <<'EOF'
          import pathlib
          import duckdb
          import polars as pl
          from etl.extracts import versions
          con = duckdb.connect()
          con.execute(
              "COPY (SELECT * FROM read_parquet('data/raw_documents/*.parquet')) "
              "TO 'data/raw_documents.parquet' (FORMAT parquet, COMPRESSION zstd)"
          )
          if list(pathlib.Path("data/raw_versions").glob("*.parquet")):
              con.execute(
                  "COPY (SELECT * FROM read_parquet('data/raw_versions/*.parquet')) "
                  "TO 'data/raw_versions.parquet' (FORMAT parquet, COMPRESSION zstd)"
              )
          else:
              pl.DataFrame(schema=versions.SCHEMA).write_parquet("data/raw_versions.parquet", compression="zstd")
          EOF
          cd data
          zstd -3 -f --quiet --rm fts.duckdb -o fts.duckdb.zst
          sha256sum documents.parquet articles.parquet paragraphs.parquet relationships.parquet raw_documents.parquet raw_versions.parquet fts.duckdb.zst create_views.sql > laws.sha256
          TAG="${{ inputs.release_tag }}"; [ -z "$TAG" ] && TAG="laws/$(date -u +%Y-%m-%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether manifest changed vs latest release
        id: digest_check
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then echo "unchanged=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          LATEST_URL=$(gh release view --json assets --jq '.assets[] | select(.name=="laws.sha256") | .url' 2>/dev/null || true)
          if [ -n "$LATEST_URL" ]; then
            LATEST_MANIFEST=$(curl -sL "$LATEST_URL")
            if [ "$LATEST_MANIFEST" = "$(cat data/laws.sha256)" ]; then
              echo "unchanged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

      - name: Compute release stats
        if: steps.digest_check.outputs.unchanged != 'true'
        id: stats
        run: |
          uv run python -c "
          import duckdb
          c = duckdb.connect()
          row = c.execute('''
              SELECT
                  (SELECT count(*) FROM read_parquet(\"data/documents.parquet\")) AS documents,
                  (SELECT count(*) FROM read_parquet(\"data/articles.parquet\")) AS articles,
                  (SELECT count(*) FROM read_parquet(\"data/paragraphs.parquet\")) AS paragraphs,
                  (SELECT max(published_at) FROM read_parquet(\"data/documents.parquet\")) AS latest
          ''').fetchone()
          for k, v in zip(['documents', 'articles', 'paragraphs', 'latest'], row):
              print(f'{k}={v}')
          " >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.digest_check.outputs.unchanged != 'true'
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          PRERELEASE=""; [ -n "${{ inputs.release_tag }}" ] && PRERELEASE="--prerelease"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          cd data
          gh release create "$TAG" $PRERELEASE \
            documents.parquet articles.parquet paragraphs.parquet relationships.parquet raw_documents.parquet raw_versions.parquet fts.duckdb.zst create_views.sql laws.sha256 \
            --title "$TAG" \
            --notes "$(cat <<EOF
          Romanian legal corpus snapshot.

          Last published act: ${{ steps.stats.outputs.latest }}

          Counts: ${{ steps.stats.outputs.documents }} documents, ${{ steps.stats.outputs.articles }} articles, ${{ steps.stats.outputs.paragraphs }} paragraphs
          EOF
          )"

      - name: Upload parse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parse-report
          path: data/parse_report.jsonl
          if-no-files-found: ignore
