name: sync-documents

# Builds the legal corpus release. The SOAP fetch is SHARDED across N runners
# (= N IPs); the endpoint scales per IP, so this turns a ~2h single-runner walk
# into ~10min. Each shard writes parquet parts into data/raw_documents/; the
# publish job gathers them, transforms, validates, and publishes the release.
# publish only runs if ALL shards succeed (a partial corpus must not publish).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel runners (= IPs)."
        default: "16"
      limit:
        description: "Cap acts per shard (smoke runs). Empty = full."
        default: ""

permissions:
  contents: write

env:
  SHARDS: ${{ inputs.shards || '16' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  extract:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ETL_DOCUMENTS_SHARD: ${{ matrix.shard }}
      ETL_DOCUMENTS_SHARDS: ${{ inputs.shards || '16' }}
      ETL_DOCUMENTS_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Extract shard
        run: uv run python -m etl.extract documents
      - uses: actions/upload-artifact@v7
        with:
          name: raw-documents-${{ matrix.shard }}
          path: data/raw_documents/*.parquet
          if-no-files-found: ignore

  publish:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: Gather raw_documents parts from all shards
        uses: actions/download-artifact@v6
        with:
          pattern: raw-documents-*
          path: data/raw_documents
          merge-multiple: true

      - name: Transform → Load (parquet + Pandera validation + FTS)
        run: uv run python -m etl.transform

      - name: Run tests (unit + corpus invariants)
        run: uv run pytest -q

      - name: Prepare release files + manifest
        id: prep
        run: |
          cp create_views.sql data/create_views.sql
          cd data
          zstd -3 -f --quiet --rm fts.duckdb -o fts.duckdb.zst
          sha256sum acte.parquet articole.parquet alineate.parquet fts.duckdb.zst create_views.sql > laws.sha256
          echo "tag=laws/$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check whether manifest changed vs latest release
        id: digest_check
        run: |
          LATEST_URL=$(gh release view --json assets --jq '.assets[] | select(.name=="laws.sha256") | .url' 2>/dev/null || true)
          if [ -n "$LATEST_URL" ]; then
            LATEST_MANIFEST=$(curl -sL "$LATEST_URL")
            if [ "$LATEST_MANIFEST" = "$(cat data/laws.sha256)" ]; then
              echo "unchanged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

      - name: Compute release stats
        if: steps.digest_check.outputs.unchanged != 'true'
        id: stats
        run: |
          uv run python -c "
          import duckdb
          c = duckdb.connect()
          row = c.execute('''
              SELECT
                  (SELECT count(*) FROM read_parquet(\"data/acte.parquet\")) AS acte,
                  (SELECT count(*) FROM read_parquet(\"data/articole.parquet\")) AS articole,
                  (SELECT count(*) FROM read_parquet(\"data/alineate.parquet\")) AS alineate,
                  (SELECT max(published_at) FROM read_parquet(\"data/acte.parquet\")) AS latest
          ''').fetchone()
          for k, v in zip(['acte', 'articole', 'alineate', 'latest'], row):
              print(f'{k}={v}')
          " >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.digest_check.outputs.unchanged != 'true'
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          cd data
          gh release create "$TAG" \
            acte.parquet articole.parquet alineate.parquet fts.duckdb.zst create_views.sql laws.sha256 \
            --title "$TAG" \
            --notes "$(cat <<EOF
          Romanian legal corpus snapshot.

          Last published act: ${{ steps.stats.outputs.latest }}

          Counts: ${{ steps.stats.outputs.acte }} acte, ${{ steps.stats.outputs.articole }} articole, ${{ steps.stats.outputs.alineate }} alineate
          EOF
          )"

      - name: Upload parse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parse-report
          path: data/parse_report.jsonl
          if-no-files-found: ignore
