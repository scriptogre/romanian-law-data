name: sync-documents

# Builds the legal corpus release by sweeping the document-id space and reading each act's
# /Public/DetaliiDocument/{id} page (the SOAP Search API drops ~1/3 of acts; see extracts/documents.py).
#
# RESUMABLE. The portal throttles per IP (~1 req/s), so the full sweep can't finish inside CI's job cap.
# Each run instead fetches only still-unfetched ids, within a wall-clock budget, and checkpoints into a
# durable `documents-cache` prerelease (raw_documents + raw_versions + swept ids — swept includes dead
# ids, so coverage can actually reach 100%). `prepare` diffs swept against the id range to get the
# remaining ids; shards sweep their slice; `merge` folds parts back into the cache and reports REMAINING.
# `publish` ships laws/<date> only once REMAINING is ~0. The nightly cron resumes where the last run
# stopped; once complete it just picks up newly-published ids. No single run ever needs to (or can) finish.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel runners (= IPs). 20 is the GitHub Free concurrency cap."
        default: "20"
      limit:
        description: "Cap ids per shard (smoke runs). Empty = full."
        default: ""
      max_id:
        description: "Pin the top of the id sweep. Empty = auto-discover (default)."
        default: ""
      release_tag:
        description: "Publish corpus to this tag instead of laws/<date> (e.g. smoke/2026-06-04)."
        default: ""
      cache_tag:
        description: "Durable sweep-cache release. Use a throwaway tag for smokes."
        default: "documents-cache"
      deadline:
        description: "Per-shard wall-clock budget in seconds. Empty = 4.5h. Use a small value for smokes."
        default: ""

permissions:
  contents: write

env:
  SHARDS: ${{ inputs.shards || '20' }}
  CACHE_TAG: ${{ inputs.cache_tag || 'documents-cache' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      max_id: ${{ steps.max_id.outputs.max_id }}
      remaining: ${{ steps.remaining.outputs.remaining }}
    steps:
      - id: gen
        run: echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Discover newest document id
        id: max_id
        run: |
          if [ -n "${{ inputs.max_id }}" ]; then
            MAX_ID="${{ inputs.max_id }}"
          else
            MAX_ID=$(uv run python -m etl.extract documents-max-id | tail -n1)
          fi
          echo "max_id=$MAX_ID" >> "$GITHUB_OUTPUT"
      - name: Compute still-unfetched ids from the cache
        id: remaining
        run: |
          mkdir -p data
          gh release download "$CACHE_TAG" --pattern 'swept_ids.parquet' --dir data || echo "no cache yet -> full sweep"
          REMAINING=$(MAX_ID="${{ steps.max_id.outputs.max_id }}" uv run python - <<'EOF'
          import os, pathlib
          import polars as pl
          max_id = int(os.environ["MAX_ID"])
          p = pathlib.Path("data/swept_ids.parquet")
          swept = set(pl.read_parquet(p)["id"].to_list()) if p.exists() else set()
          remaining = [i for i in range(1, max_id + 1) if i not in swept]
          pathlib.Path("data/remaining_ids.txt").write_text("\n".join(map(str, remaining)))
          print(len(remaining))
          EOF
          )
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "remaining ids: $REMAINING (of 1..${{ steps.max_id.outputs.max_id }})"
      - uses: actions/upload-artifact@v7
        with:
          name: remaining-ids
          path: data/remaining_ids.txt

  extract:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ETL_DOCUMENTS_SHARD: ${{ matrix.shard }}
      ETL_DOCUMENTS_SHARDS: ${{ inputs.shards || '20' }}
      ETL_DOCUMENTS_LIMIT: ${{ inputs.limit }}
      ETL_DOCUMENTS_MAX_ID: ${{ needs.prepare.outputs.max_id }}
      ETL_DOCUMENTS_DEADLINE: ${{ inputs.deadline }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - uses: actions/download-artifact@v6
        with:
          name: remaining-ids
          path: data
      - name: Sweep this shard's slice (budgeted, resumable)
        run: uv run python -m etl.extract documents
      - uses: actions/upload-artifact@v7
        with:
          name: raw-documents-${{ matrix.shard }}
          path: data/raw_documents/*.parquet
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: raw-versions-${{ matrix.shard }}
          path: data/raw_versions/*.parquet
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: swept-${{ matrix.shard }}
          path: data/swept/*.parquet
          if-no-files-found: ignore

  merge:
    needs: [prepare, extract]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      remaining: ${{ steps.merge.outputs.remaining }}
      complete: ${{ steps.merge.outputs.complete }}
    env:
      ETL_DOCUMENTS_RELEASE_TAG: ${{ inputs.cache_tag || 'documents-cache' }}
      ETL_DOCUMENTS_MAX_ID: ${{ needs.prepare.outputs.max_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Download current cache
        run: |
          mkdir -p data
          gh release download "$CACHE_TAG" --pattern 'raw_documents.parquet' --pattern 'raw_versions.parquet' --pattern 'swept_ids.parquet' --dir data || echo "first run, no cache"
      - uses: actions/download-artifact@v6
        with: { pattern: raw-documents-*, path: data/raw_documents, merge-multiple: true }
      - uses: actions/download-artifact@v6
        with: { pattern: raw-versions-*, path: data/raw_versions, merge-multiple: true }
      - uses: actions/download-artifact@v6
        with: { pattern: swept-*, path: data/swept, merge-multiple: true }
      - name: Fold parts into the cache, report REMAINING
        id: merge
        run: |
          REMAINING=$(uv run python -m etl.extract documents-merge | grep -oE 'REMAINING=[0-9]+' | cut -d= -f2)
          REMAINING=${REMAINING:-999999}
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          # complete = whole id range covered. A <=50 straggler tail (a few perma-throttled ids) still
          # publishes so it can't block forever; the next run keeps trying them.
          if [ "$REMAINING" -le 50 ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi
          echo "REMAINING=$REMAINING (publish if <=50)"

  publish:
    needs: merge
    if: needs.merge.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      # The corpus body text is ~9 GB uncompressed and growing; transform holds it
      # in RAM and peaks over the 16 GB runner, OOM-killing the runner (which also
      # destroys the logs). Back RAM with disk swap on the roomy /mnt volume so cold
      # pages page out instead of the kernel killing us, and failures stay loggable.
      - name: Add swap
        run: |
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: Download the complete sweep cache
        run: |
          mkdir -p data/raw_documents
          gh release download "$CACHE_TAG" --pattern 'raw_documents.parquet' --pattern 'raw_versions.parquet' --dir data
          cp data/raw_documents.parquet data/raw_documents/all.parquet   # transform reads data/raw_documents/*.parquet

      - name: Download relationships cache (for the status column)
        run: gh release download relationships --pattern 'raw_relationships.parquet' --dir data || echo "no relationships cache yet (status will be NULL)"

      - name: Transform → Load (parquet + Pandera validation + FTS)
        run: uv run python -m etl.transform

      - name: Run tests (unit + corpus invariants)
        run: uv run pytest -q

      - name: Prepare release files + manifest
        id: prep
        run: |
          cp create_views.sql data/create_views.sql
          cd data
          # GitHub caps each release asset at 2 GiB. Compress the FTS index, then
          # split into <2 GiB parts. Always split (even a single part) so the
          # consumer reassembly is uniform regardless of size:
          #   cat fts.duckdb.zst.part-* | zstd -d -o fts.duckdb
          zstd -3 -f --quiet --rm fts.duckdb -o fts.duckdb.zst
          split -b 1900M -d -a 2 fts.duckdb.zst fts.duckdb.zst.part-
          rm fts.duckdb.zst
          sha256sum documents.parquet articles.parquet paragraphs.parquet relationships.parquet raw_documents.parquet raw_versions.parquet fts.duckdb.zst.part-* create_views.sql > laws.sha256
          TAG="${{ inputs.release_tag }}"; [ -z "$TAG" ] && TAG="laws/$(date -u +%Y-%m-%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether manifest changed vs latest release
        id: digest_check
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then echo "unchanged=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          LATEST_URL=$(gh release view --json assets --jq '.assets[] | select(.name=="laws.sha256") | .url' 2>/dev/null || true)
          if [ -n "$LATEST_URL" ]; then
            LATEST_MANIFEST=$(curl -sL "$LATEST_URL")
            if [ "$LATEST_MANIFEST" = "$(cat data/laws.sha256)" ]; then
              echo "unchanged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"

      - name: Compute release stats
        if: steps.digest_check.outputs.unchanged != 'true'
        id: stats
        run: |
          uv run python -c "
          import duckdb
          c = duckdb.connect()
          row = c.execute('''
              SELECT
                  (SELECT count(*) FROM read_parquet(\"data/documents.parquet\")) AS documents,
                  (SELECT count(*) FROM read_parquet(\"data/articles.parquet\")) AS articles,
                  (SELECT count(*) FROM read_parquet(\"data/paragraphs.parquet\")) AS paragraphs,
                  (SELECT max(published_at) FROM read_parquet(\"data/documents.parquet\")) AS latest
          ''').fetchone()
          for k, v in zip(['documents', 'articles', 'paragraphs', 'latest'], row):
              print(f'{k}={v}')
          " >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.digest_check.outputs.unchanged != 'true'
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          PRERELEASE=""; [ -n "${{ inputs.release_tag }}" ] && PRERELEASE="--prerelease"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          cd data
          gh release create "$TAG" $PRERELEASE \
            documents.parquet articles.parquet paragraphs.parquet relationships.parquet raw_documents.parquet raw_versions.parquet fts.duckdb.zst.part-* create_views.sql laws.sha256 \
            --title "$TAG" \
            --notes "$(cat <<EOF
          Romanian legal corpus snapshot.

          Last published act: ${{ steps.stats.outputs.latest }}

          Counts: ${{ steps.stats.outputs.documents }} documents, ${{ steps.stats.outputs.articles }} articles, ${{ steps.stats.outputs.paragraphs }} paragraphs

          Full-text search index is split to fit GitHub's 2 GiB asset cap. Reassemble:
          cat fts.duckdb.zst.part-* | zstd -d -o fts.duckdb
          EOF
          )"

      - name: Upload parse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parse-report
          path: data/parse_report.jsonl
          if-no-files-found: ignore
